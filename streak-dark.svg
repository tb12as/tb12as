.t0{fill:#262c36}.t1{fill:#051d4d}.t2{fill:#0d419d}.t3{fill:#1f6feb}.t4{fill:#58a6ff}
.m{font-size:26px;font-weight:700}
.f{animation:fade .6s ease-out both}
.g{transform-box:fill-box;transform-origin:left;animation:grow .9s .45s ease-out both}
.b{transform-box:fill-box;transform-origin:bottom;animation:rise .5s ease-out both}
.fire{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes flick{50%{transform:scale(1.08,.92);opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
